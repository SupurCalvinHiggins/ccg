# Linux: the sandboxed browser is displayed via real X11 passthrough to the
# host's own X server (a local socket, not network traffic) -- no VNC needed.
#
#   docker compose -f compose.yml -f compose.x11.yaml up -d api proxy
#   docker compose -f compose.yml -f compose.x11.yaml create --build browser
#   docker start -ai $(docker compose -f compose.yml -f compose.x11.yaml ps -a -q browser)
#
# (see start.sh, which does all of the above and runs `xhost` first)
services:
  api:
    networks:
      - browser-net

  browser:
    build: ./browser
    image: ccg-browser
    stdin_open: true
    tty: true
    read_only: true
    environment:
      DISPLAY_MODE: x11
      DISPLAY: ${DISPLAY:-:0}
      API_URL: http://api:8080
      QT_X11_NO_MITSHM: "1"
    volumes:
      - ./encrypted-volume:/volume
      - /tmp/.X11-unix:/tmp/.X11-unix
    tmpfs:
      - /tmp
      - /home/chromium:uid=1000,gid=1000,mode=700
      - /data:uid=1000,gid=1000,mode=700
    devices:
      - /dev/fuse
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    networks:
      - browser-net
    depends_on:
      - api
    logging:
      driver: ${LOG_DRIVER:-none}

networks:
  browser-net:
    internal: true
